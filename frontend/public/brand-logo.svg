<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GiftsDates">
  <defs>
    <linearGradient id="gold" x1="20" y1="18" x2="108" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4CE"/>
      <stop offset="0.42" stop-color="#EDC869"/>
      <stop offset="1" stop-color="#B8862F"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="40" y1="30" x2="88" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCEFB8"/>
      <stop offset="1" stop-color="#D9AE4E"/>
    </linearGradient>
    <linearGradient id="rose" x1="34" y1="28" x2="94" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB7185"/>
      <stop offset="0.5" stop-color="#F43F5E"/>
      <stop offset="1" stop-color="#9F1239"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.38" cy="0.3" r="0.65">
      <stop stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="heartClip">
      <path d="M64 110 C 30 85, 16 62, 20 43 C 22.5 28.5, 41 23.5, 53 34.5 C 58 39, 61.5 43.5, 64 49 C 66.5 43.5, 70 39, 75 34.5 C 87 23.5, 105.5 28.5, 108 43 C 112 62, 98 85, 64 110 Z"/>
    </clipPath>
  </defs>

  <!-- Plush rose heart (the "date / love") -->
  <g filter="url(#glow)">
    <path d="M64 110 C 30 85, 16 62, 20 43 C 22.5 28.5, 41 23.5, 53 34.5 C 58 39, 61.5 43.5, 64 49 C 66.5 43.5, 70 39, 75 34.5 C 87 23.5, 105.5 28.5, 108 43 C 112 62, 98 85, 64 110 Z"
      fill="url(#rose)" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Gold gift ribbon wrapping the heart (the "gift") -->
  <g clip-path="url(#heartClip)">
    <rect x="57.5" y="30" width="13" height="82" fill="url(#goldSoft)"/>
    <rect x="16" y="59" width="96" height="13" fill="url(#goldSoft)"/>
    <!-- subtle inner highlights on the ribbon -->
    <rect x="59.5" y="30" width="2.4" height="82" fill="#FFF7DA" opacity="0.5"/>
    <rect x="16" y="61" width="96" height="2.4" fill="#FFF7DA" opacity="0.5"/>
    <!-- glossy light on the heart -->
    <path d="M64 110 C 30 85, 16 62, 20 43 C 22.5 28.5, 41 23.5, 53 34.5 C 58 39, 61.5 43.5, 64 49 C 66.5 43.5, 70 39, 75 34.5 C 87 23.5, 105.5 28.5, 108 43 C 112 62, 98 85, 64 110 Z" fill="url(#shine)"/>
  </g>

  <!-- Bow at the top -->
  <g>
    <path d="M64 36 C 55 22, 41 23, 44 33 C 46 39.5, 58 38, 64 36 Z" fill="url(#goldSoft)" stroke="#B8862F" stroke-width="1"/>
    <path d="M64 36 C 73 22, 87 23, 84 33 C 82 39.5, 70 38, 64 36 Z" fill="url(#goldSoft)" stroke="#B8862F" stroke-width="1"/>
    <path d="M58 37 L 51 52" stroke="url(#goldSoft)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M70 37 L 77 52" stroke="url(#goldSoft)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="64" cy="35" r="5" fill="url(#gold)" stroke="#B8862F" stroke-width="1"/>
  </g>
</svg>
